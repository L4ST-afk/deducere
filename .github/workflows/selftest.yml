name: selftest

# 对鸟 Deducere 的执行面只有离线命令：语法冒烟、27 组业务回归、净痕闸、文档闸。
# 全程零第三方依赖、不联网、不读环境变量——CI 跑的就是「装完能不能自证」那三条。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支连推时取消旧跑，别让过时矩阵占满 runner。
concurrency:
  group: selftest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 离线闸 · py${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装自检（语法冒烟，期望 PASS、退出码 0）
        run: python3 scripts/selftest.py

      - name: 业务回归（27 组 unittest）
        run: python3 -m unittest discover -s tests -q

      - name: 净痕闸（探针必须拔净）
        run: python3 scripts/check_clean.py --repo . --allow-file tests/test_deducere.py

      - name: 编译面（脚本与测试全量 py_compile）
        run: python3 -m py_compile scripts/*.py tests/*.py

  docs:
    name: 文档闸 · 相对链接与语言切换
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # 三件事一次判：所有相对链接都能落到磁盘；中英两版的切换行在前四行；
      # 公开件里不许出现本机路径（/Users/、dia-skills、.aurora）。
      - name: 文档一致性
        run: |
          python3 - <<'PY'
          import glob, os, re, sys
          bad = []
          for f in glob.glob('**/*.md', recursive=True):
              t = open(f, encoding='utf-8').read()
              for m in re.finditer(r'\]\(([^)#]+?)(?:#[^)]*)?\)', t):
                  p = m.group(1).strip()
                  if p.startswith(('http', 'mailto:')):
                      continue
                  q = os.path.normpath(os.path.join(os.path.dirname(f), p))
                  if not os.path.exists(q):
                      bad.append(f'坏链 {f} -> {p}')
          # 切换行判「另一语言的链接 + 该语言名」都出现在前四行；不钉死整串措辞
          # （公开件写「[中文](README.md)」，正本写「[中文正本](README.md)」，意思一样）。
          rules = [('README.md', 'README.en.md', 'English'), ('README.en.md', 'README.md', '中文'),
                   ('CHANGELOG.md', 'CHANGELOG.en.md', 'English'), ('CHANGELOG.en.md', 'CHANGELOG.md', '中文')]
          for f, other, lang in rules:
              if not os.path.exists(f):
                  continue
              head = '\n'.join(open(f, encoding='utf-8').read().splitlines()[:4]).replace('`', '')
              if other not in head or lang not in head:
                  bad.append(f'语言切换行缺「{lang}」或指向 {other} 的链接：{f}')
          # 正本（含 INTERNAL.md）本来就有内部件与本机路径，跳过这一段；公开导出件无 INTERNAL.md，照常全量扫。
          if os.path.exists('INTERNAL.md'):
              print('本机路径扫描：跳过（正本含内部件）')
          else:
              for f in glob.glob('**/*.md', recursive=True) + glob.glob('scripts/*.py') + glob.glob('scripts/*.sh'):
                  t = open(f, encoding='utf-8').read()
                  for w in ('/Users/', 'dia-skills', '.aurora'):
                      if w in t:
                          bad.append(f'本机路径 {f}: {w}')
          print(f'文档闸：{len(bad)} 处问题')
          for x in bad:
              print(' ✗', x)
          sys.exit(1 if bad else 0)
          PY

  # 汇总门：分支保护只认这一条必过检查。任何一条 job 红、取消或跳过（不可接受）都判红。
  # ⛔ 直接把矩阵 job 设成必过检查：矩阵成员名随 os/py 版本变化，改名即静默失效。
  quality-gate:
    name: quality-gate
    needs: [checks, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 汇总
        shell: bash
        run: |
          echo "checks=${{ needs.checks.result }} docs=${{ needs.docs.result }}"
          case "${{ needs.checks.result }}" in success) ;; *) echo "离线闸未通过：${{ needs.checks.result }}"; exit 1 ;; esac
          case "${{ needs.docs.result }}" in success) ;; *) echo "文档闸未通过：${{ needs.docs.result }}"; exit 1 ;; esac
